<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nv-devices | 貸与物管理</title>
<style>
:root{
  --blue:#1a6dcc;--blue-light:#e8f1fb;--blue-dark:#0d4a94;
  --green:#1d9e75;--green-light:#e1f5ee;
  --amber:#ba7517;--amber-light:#faeeda;
  --purple:#534ab7;--purple-light:#eeedfe;
  --red:#a32d2d;--red-light:#fcebeb;
  --text:#1f2328;--text-sub:#656d76;--text-muted:#8b949e;
  --border:#d8dee4;--bg:#f6f8fa;--white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;font-weight:600}
.header h1 span{color:var(--blue);margin-right:8px}
.header .refresh{font-size:12px;color:var(--text-sub);cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:5px 12px;background:var(--white)}
.header .refresh:hover{background:var(--bg)}
.container{max-width:1080px;margin:0 auto;padding:20px 24px}
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab{padding:9px 18px;font-size:14px;cursor:pointer;border:none;background:transparent;color:var(--text-sub);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover:not(.active){color:var(--text)}
.loading{text-align:center;padding:4rem;color:var(--text-muted)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:var(--red-light);border:1px solid var(--red);border-radius:8px;padding:14px 18px;color:var(--red);font-size:13px;margin-bottom:16px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.scard{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.scard-label{font-size:12px;color:var(--text-sub);margin-bottom:2px}
.scard-num{font-size:24px;font-weight:600}
.scard-num small{font-size:12px;font-weight:400;color:var(--text-sub);margin-left:3px}
.scard-sub{font-size:11px;color:var(--text-sub);margin-top:3px;line-height:1.5}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=text],.toolbar select{font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--white)}
.toolbar input[type=text]{flex:1;min-width:200px}
.toolbar input:focus,.toolbar select:focus{outline:2px solid var(--blue-light);border-color:var(--blue)}
.emp-list{display:flex;flex-direction:column;gap:8px}
.emp-card{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.emp-head{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer}
.emp-head:hover{background:#fafbfc}
.emp-name{font-size:14px;font-weight:600;min-width:120px}
.emp-status-tag{font-size:10px;padding:1px 8px;border-radius:99px;font-weight:600}
.st-active{background:var(--green-light);color:var(--green)}
.st-leaving{background:var(--amber-light);color:var(--amber)}
.st-left{background:var(--bg);color:var(--text-muted);border:1px solid var(--border)}
.emp-kind{font-size:10px;padding:1px 8px;border-radius:99px;font-weight:600;border:1px solid transparent}
.k-exec{background:var(--purple-light);color:var(--purple)}
.k-staff{background:var(--bg);color:var(--text-sub);border-color:var(--border)}
.k-haken{background:var(--blue-light);color:var(--blue-dark)}
.k-part{background:var(--green-light);color:var(--green)}
.k-stock{background:var(--bg);color:var(--text-muted);border:1px dashed var(--border)}
.emp-marks{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.mark{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.m-on{background:var(--blue-light);color:var(--blue-dark)}
.m-mobile{background:var(--green-light);color:var(--green)}
.m-hf{background:#f1efe8;color:#5f5e5a}
.m-hf-ok{background:var(--green-light);color:var(--green);border:1px solid var(--green)}
.m-wifi{background:var(--amber-light);color:var(--amber)}
.m-extra{background:var(--purple-light);color:var(--purple)}
.m-off{background:var(--bg);color:var(--text-muted);border:1px dashed var(--border)}
.emp-toggle{color:var(--text-muted);font-size:12px;transition:transform 0.15s}
.emp-card.open .emp-toggle{transform:rotate(90deg)}
.emp-detail{display:none;border-top:1px solid var(--border);padding:14px 18px;background:#fafbfc}
.emp-card.open .emp-detail{display:block}
/* 見出し（パソコン/携帯…）を左の列に固定した2カラム。値の左端が縦に揃う */
.detail-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:baseline}
.detail-label{font-size:11px;font-weight:600;color:var(--text-sub);white-space:nowrap}
.detail-rows{display:flex;flex-direction:column;gap:5px;min-width:0}
.detail-row{display:flex;align-items:baseline;gap:4px 12px;font-size:13px;flex-wrap:wrap;min-width:0}
.detail-row .k{color:var(--text-muted);font-size:11px;margin-right:-8px}
.detail-row .mono{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12px;color:var(--text)}
.detail-row .tel{font-size:13px;font-weight:600}
/* 操作リンクは右端に寄せて、機器が何台あっても縦一列に並ぶようにする */
.detail-row .edit-link,.detail-row .extra-del{margin-left:auto}
.detail-foot{grid-column:1/-1}
@media(max-width:520px){
  .detail-grid{grid-template-columns:1fr;gap:4px}
  .detail-label{margin-top:10px}
  .detail-grid>.detail-label:first-child{margin-top:0}
}
.extra-del{font-size:11px;color:var(--red);cursor:pointer;border:none;background:none;padding:2px 6px}
.extra-del:hover{text-decoration:underline}
.extra-add{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.extra-add select,.extra-add input{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--border)}
.extra-add input{flex:1;min-width:140px;max-width:300px}
.btn{padding:7px 16px;font-size:13px;border-radius:6px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-weight:500}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-dark)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-warn{border-color:var(--amber);color:var(--amber)}
.btn-danger{border-color:var(--red);color:var(--red)}
.empty{text-align:center;padding:3rem;color:var(--text-muted);font-size:13px}
.notice{font-size:13px;background:var(--amber-light);border:1px solid #e8c88a;border-radius:8px;padding:10px 16px;margin-bottom:16px;color:#7a5410}
.section-title{font-size:14px;font-weight:600;color:var(--text-sub);margin:0 0 12px}
.type-btns{display:flex;gap:8px;margin-bottom:20px}
.type-btn{padding:8px 20px;font-size:13px;border-radius:6px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-weight:500;color:var(--text)}
.type-btn.active{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.form-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;color:var(--text-sub);font-weight:600}
.form-group input,.form-group select{font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid var(--border)}
.mail-output{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.9;white-space:pre-wrap;min-height:140px;margin-bottom:12px}
.copy-note{font-size:12px;color:var(--green);display:none}
.btn-row{display:flex;gap:8px;margin-top:16px;align-items:center}
.retire-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--white);border-radius:8px;border:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap}
.ri-info{flex:1;min-width:200px}
.ri-name{font-size:13px;font-weight:600}
.ri-sub{font-size:11px;color:var(--text-sub)}
.ri-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ri-actions select{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)}
.ri-done{font-size:11px;color:var(--green);font-weight:600}
.saving{font-size:11px;color:var(--amber)}
footer{text-align:center;padding:24px;font-size:11px;color:var(--text-muted)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:10px;width:100%;max-width:520px;padding:22px 24px;box-shadow:0 8px 30px rgba(0,0,0,0.2)}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px}
.modal-form{display:flex;flex-direction:column;gap:12px}
.modal-form .form-group input,.modal-form .form-group select{width:100%}
.modal-btns{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;align-items:center}
.modal-btns .left{margin-right:auto}
.modal-err{font-size:12px;color:var(--red);margin-top:8px;display:none}
.edit-link{font-size:11px;color:var(--blue);cursor:pointer;border:none;background:none;padding:2px 6px;white-space:nowrap}
.edit-link:hover{text-decoration:underline}
.add-device-row{margin-top:10px}
.ocr-box{background:var(--blue-light);border:1px solid #bcd8f5;border-radius:8px;padding:12px 14px;margin-bottom:4px}
.ocr-lead{font-size:12px;color:var(--blue-dark);margin-bottom:8px}
.ocr-status{font-size:12px;color:var(--text-sub);margin-left:8px}
.ocr-status.err{color:var(--red)}
.ocr-hit{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-top:6px;flex-wrap:wrap}
.ocr-hit-main{flex:1;min-width:180px;font-size:12px}
.ocr-hit-main b{font-size:13px}
.ocr-warn{font-size:11px;color:var(--amber);background:var(--amber-light);border-radius:99px;padding:1px 8px;font-weight:600}
/* 1台=1カード。表だと保有者もシリアルも短くて右半分が空くので、横に並べて幅を使い切る */
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.as-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:11px 14px}
.as-card:hover{border-color:#b9c2cc}
.as-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.as-owner{font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
.as-owner:hover{text-decoration:underline}
.as-name{font-size:12px;color:var(--text-sub)}
.as-id{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12px;color:var(--text);margin-top:1px}
.as-note{font-size:11px;color:var(--text-sub);margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.as-count{font-size:11px;color:var(--text-sub);margin:0 2px 8px}
.card{background:var(--white);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mono{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12px;color:var(--text-sub)}
.sub{font-size:12px;color:var(--text-sub)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.b-pc{background:var(--blue-light);color:var(--blue-dark)}
.b-mobile{background:var(--green-light);color:var(--green)}
.b-wifi{background:var(--amber-light);color:var(--amber)}
.b-mac{background:var(--purple-light);color:var(--purple)}
.b-hf{background:#f1efe8;color:#5f5e5a}
</style>
</head>
<body>

<div class="header">
  <h1><span>■</span>nv-devices 貸与物管理</h1>
  <button class="refresh" onclick="loadData()">データ再読込</button>
</div>

<div class="container">

<div class="tabs">
  <button class="tab active" data-tab="people" onclick="showTab('people')">社員一覧</button>
  <button class="tab" data-tab="assets" onclick="showTab('assets')">機器一覧</button>
  <button class="tab" data-tab="mail" onclick="showTab('mail')">発注メール</button>
  <button class="tab" data-tab="retire" onclick="showTab('retire')">退職処理</button>
</div>

<div id="loading" class="loading"><div class="spinner"></div><div>データを読み込んでいます...</div></div>
<div id="error" style="display:none" class="error-box"></div>

<div id="content" style="display:none">

<!-- 社員一覧 -->
<div id="tab-people">
  <div class="summary">
    <div class="scard"><div class="scard-label">在籍社員</div><div class="scard-num" id="cnt-emp">—</div><div class="scard-sub" id="cnt-emp-kinds"></div></div>
    <div class="scard"><div class="scard-label">PC貸与</div><div class="scard-num" id="cnt-pc">—</div></div>
    <div class="scard"><div class="scard-label">携帯貸与</div><div class="scard-num" id="cnt-mobile">—</div></div>
    <div class="scard"><div class="scard-label">HF交換可能</div><div class="scard-num" id="cnt-hf-ok">—</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="社員名・シリアル・電話番号で検索..." oninput="renderPeople()">
    <select id="filter-emp-status" onchange="renderPeople()">
      <option value="在籍中">在籍中のみ</option>
      <option value="退職予定">退職予定のみ</option>
      <option value="退職済み">退職済みのみ</option>
      <option value="">すべて表示</option>
    </select>
    <select id="filter-missing" onchange="renderPeople()">
      <option value="">絞り込みなし</option>
      <option value="no-pc">PC未貸与</option>
      <option value="no-mobile">携帯未貸与</option>
      <option value="hf-ok">HF交換可能</option>
    </select>
    <button class="btn" onclick="exportPeopleCsv()">CSV出力</button>
    <button class="btn btn-primary" onclick="openAddEmployee()">＋ 社員追加</button>
  </div>
  <div class="emp-list" id="emp-list"></div>
</div>

<!-- 機器一覧 -->
<div id="tab-assets" style="display:none">
  <div class="summary">
    <div class="scard"><div class="scard-label">PC</div><div class="scard-num" id="as-cnt-pc">—</div></div>
    <div class="scard"><div class="scard-label">携帯</div><div class="scard-num" id="as-cnt-mobile">—</div></div>
    <div class="scard"><div class="scard-label">Wi-Fi</div><div class="scard-num" id="as-cnt-wifi">—</div></div>
    <div class="scard"><div class="scard-label">追加備品</div><div class="scard-num" id="as-cnt-extra">—</div></div>
    <div class="scard"><div class="scard-label">ヘッドフォン</div><div class="scard-num" id="as-cnt-hf">—</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="as-search" placeholder="保有者・シリアル・電話番号・契約番号で検索..." oninput="renderAssets()">
    <select id="as-type" onchange="renderAssets()">
      <option value="">すべて</option>
      <option value="PC" selected>パソコン</option>
      <option value="携帯">携帯</option>
      <option value="Wi-Fi">Wi-Fi</option>
      <option value="Mac付属品">Mac付属品</option>
      <option value="追加備品">追加備品</option>
      <option value="ヘッドフォン">ヘッドフォン</option>
    </select>
    <select id="as-status" onchange="renderAssets()">
      <option value="使用中">使用中のみ</option>
      <option value="">すべて</option>
      <option value="返却済">返却済のみ</option>
    </select>
    <button class="btn" onclick="exportAssetsCsv()">CSV出力</button>
  </div>
  <div id="assets-area"></div>
</div>

<!-- 発注メール -->
<div id="tab-mail" style="display:none">
  <div class="type-btns">
    <button class="type-btn active" id="btn-order" onclick="setMailType('order')">新規発注</button>
    <button class="type-btn" id="btn-exchange" onclick="setMailType('exchange')">交換依頼</button>
  </div>
  <div class="form-card" id="form-order">
    <div class="form-grid">
      <div class="form-group"><label>納品希望日</label><input type="date" id="order-date"></div>
      <div class="form-group"><label>台数</label><input type="number" id="order-count" min="1" value="1"></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" onclick="genOrderMail()">メール生成</button></div>
  </div>
  <div class="form-card" id="form-exchange" style="display:none">
    <div class="form-grid">
      <div class="form-group"><label>対象者</label>
        <select id="ex-owner" onchange="applyExOwner()"><option value="">社員を選ぶ...</option></select>
      </div>
      <div class="form-group"><label>シリアル番号</label>
        <input type="text" id="ex-serial">
        <span class="ri-sub" id="ex-serial-note" style="color:var(--amber)"></span>
      </div>
      <div class="form-group" style="grid-column:1/-1"><label>不具合内容</label>
        <select id="ex-issue-preset" onchange="applyIssuePreset()">
          <option value="">よくある不具合から選ぶ...</option>
          <option>キーボードのキーに不具合が生じているため</option>
          <option>ディスプレイに表示不良が生じているため</option>
          <option>電源が入らなくなったため</option>
          <option>バッテリーが充電できなくなったため</option>
          <option>動作が著しく遅くなり業務に支障が出ているため</option>
          <option>充電ポート・USBポートに不具合が生じているため</option>
          <option>内蔵カメラ・マイクに不具合が生じているため</option>
          <option>本体が破損しているため</option>
        </select>
        <input type="text" id="ex-issue" placeholder="選ぶか、自由に記入してください（例：キーボードのキーに不具合が生じているため）">
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" onclick="genExchangeMail()">メール生成</button></div>
  </div>
  <div class="section-title">生成されたメール</div>
  <div class="mail-output" id="mail-output">フォームに入力して「メール生成」を押してください</div>
  <div class="btn-row">
    <button class="btn" onclick="copyMail()">コピー</button>
    <span class="copy-note" id="copy-note">コピーしました</span>
  </div>
</div>

<!-- 退職処理 -->
<div id="tab-retire" style="display:none">
  <div class="notice">退職者を選ぶと貸与物一覧が出ます。各機器の処理（返却/スライド/ストック化）を選んで実行してください。全機器の処理が終わったら「退職済みにする」で完了です。</div>
  <div class="toolbar">
    <select id="retire-select" onchange="renderRetire()">
      <option value="">退職する社員を選択...</option>
    </select>
  </div>
  <div id="retire-area"><div class="empty">社員を選択してください</div></div>
</div>

</div><!-- /content -->
</div><!-- /container -->

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-form" id="modal-form"></div>
    <div class="modal-err" id="modal-err"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<footer>nv-devices | ナウビレッジ株式会社 管理部</footer>

<script>
// ============================================================
// 設定
// ============================================================
// GASデプロイURL
const GAS_URL = 'https://script.google.com/macros/s/AKfycby3VPMBTQE5FAHbHLrcT2TyNdEmVP7aHdwX4WHOf7X3JluXK6qp-FD51F8mGdOOevwN/exec';

// 貸与書類の自動読み取り。gas/ocr.gs の設置とGEMINI_API_KEYの登録が済んだら true にする
// （false の間は「書類を撮影」ボタンは表示されない）
const OCR_ENABLED = true;

let employees = [];
let devices = [];
let mobiles = [];
let headphones = [];
let extras = [];
let itemTypes = [];
let config = {};
let openCards = new Set();

// ---------- データ取得 ----------
async function loadData(){
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  try{
    const res = await fetch(GAS_URL + '?action=getData');
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    employees = data.employees || [];
    devices = data.devices || [];
    mobiles = data.mobiles || [];
    headphones = data.headphones || [];
    extras = data.extras || [];
    itemTypes = data.itemTypes || [];
    config = data.config || {};
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    updateSummary();
    renderPeople();
    renderAssets();
    buildRetireSelect();
    buildExOwnerSelect();
    renderRetire();
  }catch(err){
    document.getElementById('loading').style.display = 'none';
    const box = document.getElementById('error');
    box.style.display = 'block';
    box.textContent = 'データの取得に失敗しました。GAS_URLの設定とデプロイ状態を確認してください。（' + err.message + '）';
  }
}

// ---------- ヘルパー ----------
function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseDate(s){
  if(!s) return null;
  const p = s.split('/');
  if(p.length !== 3) return null;
  return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
}
function addYears(d, n){
  const r = new Date(d);
  r.setFullYear(r.getFullYear() + n);
  return r;
}
async function apiPost(body){
  const res = await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(body)
  });
  const result = await res.json();
  if(result.error) throw new Error(result.error);
  return result;
}

function personAssets(name){
  const isSpecial = name === '貸出用' || name === '派遣';
  const pcs = devices.filter(d => d['保有者'] === name && (d['種別'] === 'PC' || d['種別'] === 'Mac付属品') && d['ステータス'] !== '返却済');
  const wifis = devices.filter(d => d['保有者'] === name && d['種別'] === 'Wi-Fi' && d['ステータス'] !== '返却済');
  const mob = mobiles.filter(d => d['保有者'] === name && d['ステータス'] !== '返却済');
  const hf = headphones.find(d => d['名前'] === name && d['ステータス'] !== '返却済');
  const ext = extras.filter(d => d['保有者'] === name && d['ステータス'] !== '返却済');
  return {pcs, wifis, mob, hf, ext, isSpecial};
}

function hfInfo(hf){
  if(!hf) return null;
  const fd = parseDate(hf['初回貸与日']);
  if(!fd) return {status:'unknown', label:'HF（貸与日不明）'};
  const eligibleDate = addYears(fd, 2);
  if(new Date() >= eligibleDate) return {status:'eligible', label:'HF 交換可能', date:eligibleDate};
  const ym = eligibleDate.getFullYear() + '/' + String(eligibleDate.getMonth()+1).padStart(2,'0');
  return {status:'wait', label:'HF（' + ym + '〜交換可）', date:eligibleDate};
}

// ---------- 雇用区分 ----------
// スプレッドシートに「雇用区分」列があればその値を優先。無い場合は下記の名簿（姓）で判定し、
// 該当しない社員はすべて「正社員」として扱う。
const EMP_KIND = {
  '小川':'派遣社員',
  '藤澤':'アルバイト',
  '今村':'取締役', '田開':'取締役', '髙山':'取締役', '三宮':'取締役'
};
const KIND_CLASS = {'取締役':'k-exec', '派遣社員':'k-haken', 'アルバイト':'k-part', '正社員':'k-staff', 'ストック':'k-stock'};

function isStockRow(name){
  return name === '貸出用' || name === '派遣';  // 社員ではなく機器のストック枠
}
function empKind(e){
  const name = e['名前'] || '';
  if(isStockRow(name)) return 'ストック';
  if(e['雇用区分']) return e['雇用区分'];
  const sur = name.split(/[ 　]/)[0].replace(/高/g, '髙').replace(/沢/g, '澤');
  return EMP_KIND[sur] || '正社員';
}
function empKindTag(e){
  const k = empKind(e);
  if(!k) return '';
  return `<span class="emp-kind ${KIND_CLASS[k] || 'k-staff'}">${esc(k)}</span>`;
}

// ---------- サマリー ----------
// 在籍社員の雇用区分ごとの内訳。0名の区分は出さない。
// 雇用区分の列が無い社員は empKind が名字から補うので、必ずどれかに入る。
const KIND_ORDER = ['正社員', '取締役', '派遣社員', 'アルバイト'];
function kindBreakdown(list){
  const count = {};
  list.forEach(e => {
    const k = empKind(e);
    count[k] = (count[k] || 0) + 1;
  });
  const known = KIND_ORDER.filter(k => count[k]);
  const rest = Object.keys(count).filter(k => !KIND_ORDER.includes(k));
  // 「アルバイト3名」が途中で改行されないよう、区切りの中黒ごと1語にまとめる
  const kinds = known.concat(rest);
  return kinds.map((k, i) =>
    '<span style="white-space:nowrap">' + esc(k) + count[k] + '名' + (i < kinds.length - 1 ? '・' : '') + '</span>'
  ).join('');
}

function updateSummary(){
  const active = employees.filter(e => e['在籍状況'] === '在籍中' && e['名前'] !== '貸出用' && e['名前'] !== '派遣');
  document.getElementById('cnt-emp').innerHTML = active.length + '<small>名</small>';
  document.getElementById('cnt-emp-kinds').innerHTML = kindBreakdown(active);
  let pcCount = 0, mobCount = 0, hfOkCount = 0;
  active.forEach(e => {
    const a = personAssets(e['名前']);
    if(a.pcs.length) pcCount++;
    if(a.mob.length) mobCount++;
    const hi = hfInfo(a.hf);
    if(hi && hi.status === 'eligible') hfOkCount++;
  });
  document.getElementById('cnt-pc').innerHTML = pcCount + '<small>名</small>';
  document.getElementById('cnt-mobile').innerHTML = mobCount + '<small>名</small>';
  document.getElementById('cnt-hf-ok').innerHTML = hfOkCount + '<small>名</small>';
}

// 電話番号は 080-1234-5678、シリアルは大文字などブレるので、
// 記号と大文字小文字を落としてから突き合わせる
function searchKey(v){
  return String(v == null ? '' : v).toLowerCase().replace(/[-‐－ 　]/g, '');
}

// 名前だけでなく、貸与しているPCのシリアルや携帯の電話番号でも社員を引けるようにする。
// 返却済みの機器は personAssets に含まれないので、そちらは機器一覧から探す。
function personMatches(name, q){
  const key = searchKey(q);
  if(!key) return true;
  if(searchKey(name).includes(key)) return true;
  const a = personAssets(name);
  const fields = [];
  a.pcs.concat(a.wifis).forEach(d => fields.push(d['シリアル'], d['契約番号']));
  a.mob.forEach(d => fields.push(d['電話番号'], d['製番'], d['ICCID']));
  return fields.some(v => v && searchKey(v).includes(key));
}

// ---------- 社員一覧 ----------
// 画面に出ている社員。CSV書き出しでも同じ絞り込みを使うので関数に分けてある
function filteredEmployees(){
  const q = document.getElementById('search').value.trim();
  const statusFilter = document.getElementById('filter-emp-status').value;
  const missing = document.getElementById('filter-missing').value;

  const filtered = employees.filter(e => {
    const name = e['名前'];
    if(q && !personMatches(name, q)) return false;
    if(statusFilter && e['在籍状況'] !== statusFilter) return false;
    if(missing){
      const a = personAssets(name);
      if(missing === 'no-pc' && a.pcs.length) return false;
      if(missing === 'no-mobile' && a.mob.length) return false;
      if(missing === 'hf-ok'){
        const hi = hfInfo(a.hf);
        if(!hi || hi.status !== 'eligible') return false;
      }
    }
    return true;
  });

  // ストック枠（貸出用・派遣）は社員ではないので一覧の末尾へ
  filtered.sort((a, b) => (isStockRow(a['名前']) ? 1 : 0) - (isStockRow(b['名前']) ? 1 : 0));
  return filtered;
}

function renderPeople(){
  const filtered = filteredEmployees();
  const list = document.getElementById('emp-list');
  if(!filtered.length){
    list.innerHTML = '<div class="empty">該当なし</div>';
    return;
  }

  list.innerHTML = filtered.map(e => {
    const name = e['名前'];
    const a = personAssets(name);
    const stCls = e['在籍状況'] === '在籍中' ? 'st-active' : e['在籍状況'] === '退職予定' ? 'st-leaving' : 'st-left';
    const marks = [];

    if(a.isSpecial){
      marks.push(`<span class="mark m-on">PC ×${a.pcs.length}</span>`);
      if(a.wifis.length) marks.push(`<span class="mark m-wifi">Wi-Fi ×${a.wifis.length}</span>`);
    }else{
      marks.push(a.pcs.length ? `<span class="mark m-on">PC</span>` : `<span class="mark m-off">PC未</span>`);
      marks.push(a.mob.length ? `<span class="mark m-mobile">携帯</span>` : `<span class="mark m-off">携帯未</span>`);
      const hi = hfInfo(a.hf);
      if(hi){
        marks.push(`<span class="mark ${hi.status === 'eligible' ? 'm-hf-ok' : 'm-hf'}">${esc(hi.label)}</span>`);
      }else{
        marks.push(`<span class="mark m-off">HF未</span>`);
      }
      if(a.wifis.length) marks.push(`<span class="mark m-wifi">Wi-Fi</span>`);
      if(a.ext.length) marks.push(`<span class="mark m-extra">+${a.ext.length}備品</span>`);
    }

    const isOpen = openCards.has(name);
    return `<div class="emp-card ${isOpen ? 'open' : ''}" id="card-${esc(name)}">
      <div class="emp-head" onclick="toggleCard('${esc(name)}')">
        <span class="emp-name">${esc(name)}</span>${empKindTag(e)}
        ${a.isSpecial ? '' : `<span class="emp-status-tag ${stCls}">${esc(e["在籍状況"])}</span>`}
        <div class="emp-marks">${marks.join('')}</div>
        <span class="emp-toggle">▶</span>
      </div>
      <div class="emp-detail">${isOpen ? renderDetail(name) : ''}</div>
    </div>`;
  }).join('');
}

function toggleCard(name){
  if(openCards.has(name)){
    openCards.delete(name);
  }else{
    openCards.add(name);
  }
  renderPeople();
}

function renderDetail(name){

  // 見出しを左の列にまとめた2カラム。1台＝1行なので、機器が増えても

  const section = (label, rows) => {
    if(!rows.length) return;
    sections.push(`<div class="detail-label">${label}</div><div class="detail-rows">${rows.join('')}</div>`);
  };
  const editBtn = (sheet, key) =>
    `<button class="edit-link" onclick="openEditDevice('${sheet}','${esc(key)}','${esc(name)}')">編集</button>`;

  // ストック枠（貸出用・派遣）は社員ではないので在籍状況を持たない
  if(emp && !a.isSpecial){
    section('社員情報', [`<div class="detail-row">

    </div>`]);
  }

  // カードでは機器を見分けられればよいので、PCはシリアル・携帯は電話番号だけ出す。
  // 見出しで何の機器かは分かるため、値そのものだけを置いて項目名は省く。
  // 契約番号や製番は入力しなくなったが、既存データは機器一覧の検索から引ける。
  section('パソコン', a.pcs.map(d => `<div class="detail-row">
    <span class="mono">${esc(d['シリアル'])}</span>
    ${d['備考'] ? `<span class="sub">${esc(d['備考'])}</span>` : ''}
    ${editBtn('通信機器', d['シリアル'])}
  </div>`));

  // 電話番号が携帯を引くキーなので、空の行は編集させない（別の行を書き換えてしまう）
  section('携帯', a.mob.map(d => `<div class="detail-row">
    <span class="mono tel">${esc(d['電話番号']) || '電話番号なし'}</span>
    ${d['備考'] ? `<span class="sub">${esc(d['備考'])}</span>` : ''}
    ${d['電話番号']

  </div>`));

  if(a.hf){
    const hi = hfInfo(a.hf);
    section('ヘッドフォン', [`<div class="detail-row">
      <span class="k">初回貸与</span><span>${esc(a.hf['初回貸与日']) || '不明'}</span>
      ${hi && hi.date ? `<span class="k">交換可能時期</span><span>${hi.date.getFullYear()}/${String(hi.date.getMonth()+1).padStart(2,'0')}</span>` : ''}
      ${hi && hi.status === 'eligible' ? '<span class="mark m-hf-ok">交換可能</span>' : ''}
      ${editBtn('ヘッドフォン', name)}
    </div>`]);
  }

  section('Wi-Fi', a.wifis.map(d => `<div class="detail-row">
    <span class="mono">${esc(d['シリアル'])}</span>
    ${editBtn('通信機器', d['シリアル'])}
  </div>`));

  // 追加備品は0点でも追加フォームを出すので、他とちがって常に表示する
  const extraRows = a.ext.length ? a.ext.map(d => `<div class="detail-row">

    </select>
    <input type="text" id="extra-note-${esc(name)}" placeholder="備考（型番など）">
    <button class="btn btn-sm" onclick="addExtra('${esc(name)}')">追加</button>
    <span class="saving" id="extra-save-${esc(name)}"></span>

  section('追加備品', extraRows);

  return `<div class="detail-grid">${sections.join('')}
    <div class="detail-foot">
      <button class="btn btn-sm" onclick="openAddDevice('${esc(name)}')">＋ 機器を追加（PC / 携帯 / Wi-Fi）</button>

}

async function addExtra(name){
  const type = document.getElementById('extra-type-' + name).value;
  const note = document.getElementById('extra-note-' + name).value;
  const label = document.getElementById('extra-save-' + name);
  label.textContent = '保存中...';
  try{
    await apiPost({action:'addExtraItem', owner:name, itemType:type, note:note});
    await loadData();
    openCards.add(name);
    renderPeople();
  }catch(err){
    label.textContent = '保存失敗: ' + err.message;

}

async function delExtra(rowId, name){
  if(!confirm('この備品を削除しますか？')) return;
  try{
    await apiPost({action:'removeExtraItem', rowId:rowId});
    await loadData();
    openCards.add(name);
    renderPeople();
  }catch(err){
    alert('削除失敗: ' + err.message);
  }
}

// ---------- 機器一覧 ----------
const ASSET_TYPES = ['PC', '携帯', 'Wi-Fi', 'Mac付属品', '追加備品', 'ヘッドフォン'];

function assetRows(type, status){
  // 種別が空＝「すべて」。番号で横断的に探せるように全種別をまとめて返す
  if(!type) return ASSET_TYPES.reduce((all, t) => all.concat(assetRows(t, status)), []);
  const rows = [];
  if(type === 'PC' || type === 'Wi-Fi' || type === 'Mac付属品'){
    devices.filter(d => d['種別'] === type).forEach(d => {
      rows.push({model:d['種別'], name:d['商品名'] || '', owner:d['保有者'], id:d['シリアル'], id2:d['契約番号'], end:d['契約終了'], note:d['備考'], status:d['ステータス']});
    });
  }else if(type === '携帯'){
    mobiles.forEach(d => {
      rows.push({model:'携帯', name:d['商品名'] || '', owner:d['保有者'], id:d['電話番号'], id2:d['製番'], end:'', note:d['備考'] || '', status:d['ステータス']});
    });
  }else if(type === '追加備品'){
    extras.forEach(d => {
      rows.push({model:d['種別'], name:'', owner:d['保有者'], id:'', id2:'', end:'', note:(d['貸与日'] ? d['貸与日'] + (d['備考'] ? ' / ' + d['備考'] : '') : d['備考']), status:d['ステータス']});
    });
  }else if(type === 'ヘッドフォン'){
    headphones.forEach(d => {
      const hi = hfInfo(d['ステータス'] !== '返却済' ? d : null);
      rows.push({model:'ヘッドフォン', name:'', owner:d['名前'], id:'', id2:'', end:d['初回貸与日'], note:(hi && hi.status === 'eligible' ? '交換可能' : hi && hi.date ? hi.date.getFullYear() + '/' + String(hi.date.getMonth()+1).padStart(2,'0') + '〜交換可' : ''), status:d['ステータス']});
    });
  }
  return rows.filter(r => !status || r.status === status);
}

function updateAssetSummary(){
  const st = document.getElementById('as-status').value;
  document.getElementById('as-cnt-pc').innerHTML = assetRows('PC', st).length + '<small>台</small>';
  document.getElementById('as-cnt-mobile').innerHTML = assetRows('携帯', st).length + '<small>台</small>';
  document.getElementById('as-cnt-wifi').innerHTML = assetRows('Wi-Fi', st).length + '<small>台</small>';
  document.getElementById('as-cnt-extra').innerHTML = assetRows('追加備品', st).length + '<small>点</small>';
  document.getElementById('as-cnt-hf').innerHTML = assetRows('ヘッドフォン', st).length + '<small>台</small>';
}

// ---------- CSV書き出し ----------
// Excelで開くことが前提なので、UTF-8のBOMを付けて改行はCRLFにする。
// 出力対象は画面に出ている行そのもの（検索・絞り込みがそのまま効く）。
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows){
  const body = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF' + body], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function stamp(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
}

// 社員ごとに1行。1人が複数台持っていることがあるので同じ列に「 / 」で並べる

      a.hf ? a.hf['初回貸与日'] : '',
      a.ext.map(d => d['種別'] + (d['備考'] ? '（' + d['備考'] + '）' : '')).join(' / '),
      e['備考'] || ''
    ]);
  });
  downloadCsv('社員貸与一覧_' + stamp() + '.csv', rows);
}

function renderRetire(){
  const name = document.getElementById('retire-select').value;
  const area = document.getElementById('retire-area');
  if(!name){
    area.innerHTML = '<div class="empty">社員を選択してください</div>';
    return;
  }
  const emp = employees.find(e => e['名前'] === name);
  const a = personAssets(name);
  const items = [];

  a.pcs.forEach(d => items.push({sheet:'通信機器', key:d['シリアル'], type:d['種別'], label:d['種別'] === 'PC' ? 'パソコン' : d['種別'], sub:'シリアル: ' + d['シリアル'], canSlide:true}));
  a.wifis.forEach(d => items.push({sheet:'通信機器', key:d['シリアル'], type:'Wi-Fi', label:'Wi-Fi', sub:'シリアル: ' + d['シリアル'], canSlide:true}));
  a.mob.forEach(d => items.push({sheet:'社用携帯', key:d['電話番号'], type:'携帯', label:'携帯', sub:'電話番号: ' + d['電話番号'], canSlide:true}));
  if(a.hf) items.push({sheet:'ヘッドフォン', key:name, type:'ヘッドフォン', label:'ヘッドフォン', sub:'初回貸与: ' + (a.hf['初回貸与日'] || '不明'), canSlide:false});
  a.ext.forEach(d => items.push({sheet:'追加備品', key:String(d['_row']), type:d['種別'], label:d['種別'], sub:d['備考'] || '', canSlide:false, isExtra:true, rowId:d['_row']}));

  const activeEmployees = employees.filter(e => e['在籍状況'] === '在籍中' && e['名前'] !== name && e['名前'] !== '貸出用' && e['名前'] !== '派遣');

  let html = '';
  if(emp['在籍状況'] === '在籍中'){
    html += `<div class="btn-row" style="margin:0 0 16px">
      <button class="btn btn-warn" onclick="setEmpStatus('${esc(name)}', '退職予定')">退職予定にする</button>
      <span class="ri-sub">まず退職予定に変更してから機器を処理してください</span>
    </div>`;
  }else{
    html += `<div class="btn-row" style="margin:0 0 16px">
      <button class="btn" onclick="setEmpStatus('${esc(name)}', '在籍中')">在籍中に戻す</button>
      <span class="ri-sub">${emp['在籍状況'] === '退職済み' ? '返却済みにした機器は戻らないので、必要なら貸与を登録し直してください' : '間違えて退職予定にした場合はここで戻せます'}</span>
    </div>`;
  }

  if(!items.length){
    html += `<div class="empty" style="padding:1.5rem">貸与物はすべて処理済みです</div>`;
    html += `<div class="btn-row"><button class="btn btn-danger" onclick="setEmpStatus('${esc(name)}', '退職済み')">退職済みにする</button></div>`;
  }else{
    html += items.map((it, i) => {
      const badgeCls = it.type === 'PC' || it.type === 'Mac付属品' ? 'b-pc' : it.type === '携帯' ? 'b-mobile' : it.type === 'Wi-Fi' ? 'b-wifi' : it.type === 'ヘッドフォン' ? 'b-hf' : 'b-mac';
      let actions = '';
      if(it.isExtra){
        actions = `<button class="btn btn-sm" onclick="retireExtra(${it.rowId}, '${esc(name)}')">回収（削除）</button>`;
      }else if(it.canSlide){
        actions = `
          <button class="btn btn-sm" onclick="retireReturn('${esc(it.sheet)}', '${esc(it.key)}', '${esc(name)}')">返却</button>
          <select id="slide-to-${i}">
            <option value="">スライド先...</option>
            ${activeEmployees.map(e => `<option value="${esc(e['名前'])}">${esc(e['名前'])}</option>`).join('')}
          </select>
          <button class="btn btn-sm" onclick="retireSlide('${esc(it.sheet)}', '${esc(it.key)}', '${esc(name)}', ${i})">スライド</button>
          <button class="btn btn-sm" onclick="retireStock('${esc(it.sheet)}', '${esc(it.key)}', '${esc(name)}')">ストック化</button>`;
      }else{
        actions = `<button class="btn btn-sm" onclick="retireReturn('${esc(it.sheet)}', '${esc(it.key)}', '${esc(name)}')">回収済みにする</button>`;
      }
      return `<div class="retire-item">
        <span class="badge ${badgeCls}">${esc(it.type)}</span>
        <div class="ri-info">
          <div class="ri-name">${esc(it.label)}</div>
          <div class="ri-sub">${esc(it.sub)}</div>
        </div>
        <div class="ri-actions">${actions}</div>
      </div>`;
    }).join('');
    html += `<div class="ri-sub" style="margin-top:10px">残り ${items.length} 点。全機器の処理が終わると「退職済みにする」ボタンが出ます。</div>`;
  }

  area.innerHTML = html;
}

// ---------- 書類の読み取り（OCR） ----------
// スマホで貸与書類を撮影し、Gemini APIで項目を抽出してフォームに流し込む。
// 抽出結果は必ず目視で確認してから登録すること（シリアルの誤読が起こりうるため）。
// GAS側（gas/ocr.gs）の設置とAPIキー登録が済んだら OCR_ENABLED を true にする。

function ocrBoxHtml(){
  if(!OCR_ENABLED) return '';
  return `<div class="ocr-box">
    <div class="ocr-lead">貸与書類を撮影すると、機器の種類とシリアル（携帯は電話番号）を自動で読み取ります（最大5枚）。</div>
    <button class="btn btn-sm" type="button" onclick="document.getElementById('ocr-file').click()">書類を撮影 / 画像を選ぶ</button>
    <span class="ocr-status" id="ocr-status"></span>
    <input type="file" id="ocr-file" accept="image/*" capture="environment" multiple style="display:none" onchange="runOcr()">
    <div id="ocr-result"></div>
  </div>`;
}

let ocrDevices = [];

async function runOcr(){
  const input = document.getElementById('ocr-file');
  const status = document.getElementById('ocr-status');
  const result = document.getElementById('ocr-result');
  const files = [...input.files].slice(0, 5);
  input.value = '';                       // 同じ画像を選び直せるようにする
  if(!files.length) return;

  status.className = 'ocr-status';
  status.textContent = '画像を準備中...';
  result.innerHTML = '';
  ocrDevices = [];
  try{
    const images = [];
    for(const f of files) images.push(await imageToBase64(f, 1600));
    status.textContent = '読み取り中...（10秒ほどかかります）';
    const res = await apiPost({action:'ocrDocument', images:images});
    ocrDevices = res.devices || [];
    if(!ocrDevices.length){
      status.className = 'ocr-status err';
      status.textContent = '機器情報を見つけられませんでした。明るい場所で撮り直してください。';
      return;
    }
    status.textContent = ocrDevices.length + '件を読み取りました。内容を確認して選んでください。';
    result.innerHTML = ocrDevices.map((d, i) => `<div class="ocr-hit">
      <div class="ocr-hit-main">
        <b>${esc(d.kind) || '機器'}</b><br>
        <span class="mono">${esc(d.kind === '携帯' ? d.tel : d.serial) || '未検出'}</span>
        ${d.note ? `<br><span class="sub">${esc(d.note)}</span>` : ''}
      </div>
      ${d.confidence === 'low' ? '<span class="ocr-warn">要確認</span>' : ''}
      <button class="btn btn-sm" type="button" onclick="applyOcr(${i})">入力する</button>
    </div>`).join('');
  }catch(err){
    status.className = 'ocr-status err';
    status.textContent = '読み取り失敗: ' + err.message;
  }
}

// 撮影画像は数MBになるため、長辺を縮めてJPEGにしてから送る
function imageToBase64(file, maxSide){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({mimeType:'image/jpeg', data:c.toDataURL('image/jpeg', 0.85).split(',')[1]});
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}

// 読み取り結果を登録フォームへ流し込む（保存はせず、目視確認してから登録する）
function applyOcr(i){
  const d = ocrDevices[i];
  if(!d) return;
  const kindSel = document.getElementById('m-kind');
  const kind = ['PC', '携帯', 'Wi-Fi', 'Mac付属品'].includes(d.kind) ? d.kind : 'PC';
  kindSel.value = kind;
  renderAddDeviceFields();
  // 契約番号・契約日はフォームから外したので流し込まない（読み取り自体は残っている）
  if(kind === '携帯'){
    setVal('m-tel', d.tel);
  }else{
    setVal('m-serial', d.serial);
    setVal('m-note', d.note);
  }
  document.getElementById('ocr-status').textContent = '入力しました。内容（特にシリアル）を確認してから登録してください。';
}

function setVal(id, value){
  const el = document.getElementById(id);
  if(el && value) el.value = value;
}

// ---------- 機器の新規登録 ----------
function openAddDevice(owner){
  showModal('機器を追加 — ' + owner,
    ocrBoxHtml() +
    fSelect('m-kind', '機器の種類', ['PC', '携帯', 'Wi-Fi', 'Mac付属品'], 'PC') +
    `<div id="m-device-fields"></div>`,
    `<button class="btn" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="submitAddDevice('${esc(owner)}')">登録</button>`
  );
  document.getElementById('m-kind').addEventListener('change', renderAddDeviceFields);
  renderAddDeviceFields();
}
function renderAddDeviceFields(){
  const kind = mv('m-kind');
  const area = document.getElementById('m-device-fields');
  if(kind === '携帯'){
    area.innerHTML =
      fInput('m-tel', '電話番号（必須）', '', '例：080-1234-5678') +
      fInput('m-note', '備考', '');
  }else{
    area.innerHTML =
      fInput('m-serial', 'シリアル（必須）', '') +
      fInput('m-note', '備考', '');
  }
}
async function submitAddDevice(owner){
  const kind = mv('m-kind');
  try{
    if(kind === '携帯'){
      const tel = mv('m-tel');
      if(!tel){ modalError('電話番号を入力してください'); return; }
      // 電話番号が携帯を引くキーなので、使用中で重複すると編集時にどちらの行か
      // 決まらなくなる。返却済みの番号を再利用するぶんには問題ない。
      if(mobiles.some(m => m['電話番号'] === tel && m['ステータス'] !== '返却済')){
        modalError('この電話番号の携帯はすでに使用中で登録されています'); return;
      }
      await apiPost({action:'addDevice', sheet:'社用携帯', row:{
        '保有者':owner, '電話番号':tel, '備考':mv('m-note'), 'ステータス':'使用中'
      }});
    }else{
      if(!mv('m-serial')){ modalError('シリアルを入力してください'); return; }
      await apiPost({action:'addDevice', sheet:'通信機器', row:{
        '保有者':owner, '種別':kind,
        'シリアル':mv('m-serial'), '備考':mv('m-note'), 'ステータス':'使用中'
      }});
    }
    closeModal();
    await loadData();
    openCards.add(owner);
    renderPeople();
  }catch(err){
    modalError('登録失敗: ' + err.message);
  }
}

// ---------- 機器の編集 ----------
function openEditDevice(sheet, key, owner){
  if(sheet === '通信機器'){
    const d = devices.find(x => x['シリアル'] === key);
    if(!d) return;
    showModal('機器を編集',
      fSelect('m-owner', '保有者', ownerOptions(), d['保有者']) +
      fSelect('m-kind', '種別', ['PC', 'Wi-Fi', 'Mac付属品'], d['種別']) +
      fInput('m-serial', 'シリアル', d['シリアル']) +
      fInput('m-note', '備考', d['備考']) +
      fSelect('m-status', 'ステータス', ['使用中', '返却済'], d['ステータス']),
      `<button class="btn btn-danger left" onclick="submitDeleteDevice('通信機器', 'シリアル', '${esc(key)}', '${esc(owner)}')">この機器を削除</button>
       <button class="btn" onclick="closeModal()">キャンセル</button>
       <button class="btn btn-primary" onclick="submitEditDevice('通信機器', 'シリアル', '${esc(key)}', '${esc(owner)}')">保存</button>`
    );
  }else if(sheet === '社用携帯'){
    const d = mobiles.find(x => x['電話番号'] === key);
    if(!d) return;
    showModal('携帯を編集',
      fSelect('m-owner', '保有者', ownerOptions(), d['保有者']) +
      fInput('m-tel', '電話番号', d['電話番号']) +
      fInput('m-note', '備考', d['備考']) +
      fSelect('m-status', 'ステータス', ['使用中', '返却済'], d['ステータス']),
      `<button class="btn btn-danger left" onclick="submitDeleteDevice('社用携帯', '電話番号', '${esc(key)}', '${esc(owner)}')">この携帯を削除</button>
       <button class="btn" onclick="closeModal()">キャンセル</button>
       <button class="btn btn-primary" onclick="submitEditDevice('社用携帯', '電話番号', '${esc(key)}', '${esc(owner)}')">保存</button>`
    );
  }else if(sheet === 'ヘッドフォン'){
    const d = headphones.find(x => x['名前'] === key);
    if(!d) return;
    showModal('ヘッドフォンを編集 — ' + key,
      fInput('m-first', '初回貸与日（yyyy/mm/dd）', d['初回貸与日']) +
      fInput('m-ex1', '1回目交換', d['1回目交換']) +
      fInput('m-ex2', '2回目交換', d['2回目交換']) +
      fInput('m-ex3', '3回目交換', d['3回目交換']) +
      fInput('m-note', '備考', d['備考']) +
      fSelect('m-status', 'ステータス', ['使用中', '返却済'], d['ステータス']),
      `<button class="btn" onclick="closeModal()">キャンセル</button>
       <button class="btn btn-primary" onclick="submitEditHf('${esc(key)}', '${esc(owner)}')">保存</button>`
    );
  }
}
async function submitEditDevice(sheet, keyCol, key, owner){
  try{
    let values;
    if(sheet === '通信機器'){
      values = {
        '保有者':mv('m-owner'), '種別':mv('m-kind'),
        'シリアル':mv('m-serial'), '備考':mv('m-note'), 'ステータス':mv('m-status')
      };
    }else{
      values = {
        '保有者':mv('m-owner'), '電話番号':mv('m-tel'),
        '備考':mv('m-note'), 'ステータス':mv('m-status')
      };
    }
    await apiPost({action:'updateRow', sheet:sheet, keyCol:keyCol, key:key, values:values});
    closeModal();
    await loadData();
    openCards.add(owner);
    renderPeople();
  }catch(err){
    modalError('保存失敗: ' + err.message);
  }
}
async function submitEditHf(key, owner){
  try{
    await apiPost({action:'updateRow', sheet:'ヘッドフォン', keyCol:'名前', key:key, values:{
      '初回貸与日':mv('m-first'), '1回目交換':mv('m-ex1'), '2回目交換':mv('m-ex2'),
      '3回目交換':mv('m-ex3'), '備考':mv('m-note'), 'ステータス':mv('m-status')
    }});
    closeModal();
    await loadData();
    openCards.add(owner);
    renderPeople();
  }catch(err){
    modalError('保存失敗: ' + err.message);
  }
}
async function submitDeleteDevice(sheet, keyCol, key, owner){
  if(!confirm('この機器のデータを完全に削除しますか？（返却済みにする場合はステータスを変更してください）')) return;
  try{
    await apiPost({action:'deleteRow', sheet:sheet, keyCol:keyCol, key:key});
    closeModal();
    await loadData();
    openCards.add(owner);
    renderPeople();
  }catch(err){
    modalError('削除失敗: ' + err.message);
  }
}

// ---------- 初期化 ----------
loadData();
</script>
</body>
